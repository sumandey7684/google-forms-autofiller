<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>P5 Fill Fixture</title>
  </head>
  <body>
    <div role="list" id="fill-list">
      <div role="listitem" id="f-text">
        <div role="heading">Full Name</div>
        <input type="text" aria-label="Full Name" name="entry.100" />
      </div>

      <div role="listitem" id="f-para">
        <div role="heading">About you</div>
        <textarea aria-label="About you"></textarea>
      </div>

      <div role="listitem" id="f-mc">
        <div role="heading">Available?</div>
        <div role="radiogroup">
          <div role="radio" aria-label="Yes" aria-checked="false"></div>
          <div role="radio" aria-label="No" aria-checked="false"></div>
        </div>
      </div>

      <div role="listitem" id="f-check">
        <div role="heading">Skills</div>
        <div role="checkbox" aria-label="TypeScript" aria-checked="true"></div>
        <div role="checkbox" aria-label="React" aria-checked="false"></div>
        <div role="checkbox" aria-label="Go" aria-checked="false"></div>
      </div>

      <div role="listitem" id="f-check-exact">
        <div role="heading">Exact set A</div>
        <div role="checkbox" aria-label="Java" aria-checked="true"></div>
        <div role="checkbox" aria-label="Python" aria-checked="true"></div>
        <div role="checkbox" aria-label="C++" aria-checked="false"></div>
      </div>

      <div role="listitem" id="f-check-dup">
        <div role="heading">Exact set B (same option labels, isolated)</div>
        <div role="checkbox" aria-label="Java" aria-checked="false"></div>
        <div role="checkbox" aria-label="Python" aria-checked="false"></div>
        <div role="checkbox" aria-label="日本語" aria-checked="true"></div>
      </div>

      <div role="listitem" id="f-select">
        <div role="heading">Country</div>
        <select aria-label="Country">
          <option>IN</option>
          <option>US</option>
          <option>UK</option>
        </select>
      </div>

      <div role="listitem" id="f-scale">
        <div role="heading">Interest</div>
        <div role="radiogroup">
          <div role="radio" aria-label="1" aria-checked="false"></div>
          <div role="radio" aria-label="2" aria-checked="false"></div>
          <div role="radio" aria-label="3" aria-checked="false"></div>
          <div role="radio" aria-label="4" aria-checked="false"></div>
          <div role="radio" aria-label="5" aria-checked="false"></div>
        </div>
      </div>

      <div role="listitem" id="f-date">
        <div role="heading">Start date</div>
        <input type="date" aria-label="Start date" />
      </div>

      <div role="listitem" id="f-time">
        <div role="heading">Start time</div>
        <input type="time" aria-label="Start time" />
      </div>

      <div role="listitem" id="f-unknown">
        <div role="heading">Weird</div>
        <input type="text" aria-label="A" />
        <textarea aria-label="B"></textarea>
      </div>

      <div role="listitem" id="f-file">
        <div role="heading">Upload</div>
        <input type="file" aria-label="Upload" />
      </div>

      <div role="listitem" id="f-nav">
        <div role="heading">Actions</div>
        <button type="button" id="btn-next">Next</button>
        <button type="button" id="btn-back">Back</button>
        <button type="submit" id="btn-submit">Submit</button>
      </div>
    </div>
  </body>
</html>
